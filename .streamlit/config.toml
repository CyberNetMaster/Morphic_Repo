# Base theme: dark everywhere. These values mirror app/theme.py (DARK and ACCENT); Streamlit reads
# them at start-up for its own widgets (data editors, dropdowns, dialogs). Everything else is styled
# from app/theme.py.
[theme]
base = "dark"
primaryColor = "#0A84FF"
backgroundColor = "#050506"
secondaryBackgroundColor = "#141416"
textColor = "#F5F5F7"
font = "sans serif"

[server]
headless = true
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false
