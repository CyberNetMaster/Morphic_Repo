      strength_z: {title: "EOS Aluminium AlSi10Mg Material Data Sheet (PDF, archived copy of the EOS file)", version_or_date: "see strength_xy", page: "section EOS M 290 | 30 um, Mechanical properties (as manufactured state), Vertical Rp0.2 230 MPa", url: "https://web.archive.org/web/20250709102926id_/https://www.eos.info/var/assets/05-datasheet-images/Assets_MDS_Metal/EOS_Aluminium_AlSi10Mg/Material_Datasheet_EOS_Aluminium_AlSi10Mg_EN.pdf?v=6"}
      interlayer_shear: null
      density: {title: "EOS Aluminium AlSi10Mg Material Data Sheet (PDF, archived copy of the EOS file)", version_or_date: "see strength_xy", page: "section EOS M 290 | 30 um, Density ISO 3369, 'Average density >= 2.67 g/cm3' (34 samples)", url: "https://web.archive.org/web/20250709102926id_/https://www.eos.info/var/assets/05-datasheet-images/Assets_MDS_Metal/EOS_Aluminium_AlSi10Mg/Material_Datasheet_EOS_Aluminium_AlSi10Mg_EN.pdf?v=6"}
      cost: {title: "Additive Plus product search 'AlSi10Mg'", version_or_date: "seen 2026-10-20", page: "CNPC AlSi10Mg 10 kg: '$41/kg, $410'; product page https://additiveplus.com/product/aluminum-powder-alsi10mg-lpbf-compatible-10-kg-22-lbs/", url: "https://additiveplus.com/?s=AlSi10Mg&post_type=product"}
    flags:
      - "E_xy: the current EOS MDS (2025/2026 editions) lists no modulus at all. Value taken from the older EOS 05.2014 sheet ('as built', XY 75 +/- 10 GPa), read from an archived copy hosted by a reseller (gpiprototype.com) because the EOS original URL is gone. Expected ~70000; the 2014 sheet gives 70 GPa for Z as built and for XY after stress relief."
      - "nu: typical value, not from TDS; third-party source (nTop docs quoting MatWeb)."
      - "strength: 'as manufactured' (no heat treatment) condition from the EOS M 290 | 30 um process; EOS T6 values differ (see condition_note). Live EOS PDF link returned 404 on 2026-10-20, so the Wayback Machine copy of the EOS PDF was used; the EOS process-data web page for M 290 | 30 um (https://www.eos.info/metal-solutions/data-sheets/aluminium/pds-eos-aluminium-alsi10mg-eos-m-290-30um) shows the same as-manufactured values (233 / 270 MPa typical, 466 / 461 MPa Rm)."
      - "cost: third-party source; reseller price for non-EOS AlSi10Mg powder."
      - "density: EOS states '>= 2.67 g/cm3' (a lower bound), recorded as 2.67."

