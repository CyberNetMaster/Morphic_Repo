      source: "Ultimaker PETG TDS v1.00 (2022-04-29), p.2: tensile stress at break XY (flat) 38.5 +/- 1.4 MPa vs Z (upright) 19.0 +/- 6.4 MPa, ASTM D3039. Ratio 19.0/38.5 = 0.49. Different PETG brand; https://um-support-files.ultimaker.com/materials/2.85mm/tds/PETG/Ultimaker-PETG-TDS-v1.00.pdf"
    citations:
      E: {title: "Technical datasheet Prusament PETG by Prusa Polymers", version_or_date: "Version 1.1, last update 16-02-2022", page: "2 (Mechanical properties of 3D printed testing specimens, Tensile Modulus, Horizontal)", url: "https://storage.googleapis.com/prusa3d-content-prod-14e8-wordpress-prusament-prod/2023/10/9f8d2165-tds_prusament-petg_n_en.pdf"}
      nu: {title: "Guessasma, Belhabib, Nouri: Printability and Tensile Performance of 3D Printed PETG Using FDM, Polymers 11(7):1220", version_or_date: "2019", page: "Modelling Technique section: 'Poisson's coefficient (0.4) of the as-received PETG filament'", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6680790/"}
      strength_xy: {title: "Technical datasheet Prusament PETG by Prusa Polymers", version_or_date: "Version 1.1, last update 16-02-2022", page: "2 (Tensile Yield Strength, Horizontal, ISO 527-1)", url: "https://storage.googleapis.com/prusa3d-content-prod-14e8-wordpress-prusament-prod/2023/10/9f8d2165-tds_prusament-petg_n_en.pdf"}
      strength_z: null
      interlayer_shear: null
      density: {title: "Technical datasheet Prusament PETG by Prusa Polymers", version_or_date: "Version 1.1, last update 16-02-2022", page: "2 (Typical material properties, Density, ISO 1183)", url: "https://storage.googleapis.com/prusa3d-content-prod-14e8-wordpress-prusament-prod/2023/10/9f8d2165-tds_prusament-petg_n_en.pdf"}
      cost: {title: "Prusament PETG material page", version_or_date: "seen 2026-10-20", page: "price list, 1 kg standard spools", url: "https://prusament.com/materials/prusament-petg/"}
    flags:
      - "nu: typical value, not from TDS. The cited paper used 0.4 as a model input and did not measure it; no measured PETG Poisson's ratio was found."
      - "strength_z: TDS has no Z-loaded value. Its 'Vertical xz' column (50 +/- 1 MPa) is an on-edge specimen, so it was not used as Z strength. TDS also lists 'Interlayer Adhesion 18 +/- 4 MPa' (in-house 'Prusa Polymers' method, test not defined); not used."
      - "interlayer_shear: TDS 'Interlayer Adhesion 18 +/- 4 MPa' is not labelled as a shear value, so it was not recorded here."
      - "z_knockdown: ratio comes from a different maker's PETG (Ultimaker), not from Prusa."

