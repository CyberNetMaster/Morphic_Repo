      strength_xy: {title: "Polymaker Fiberon PA6-CF20 Technical Data Sheet", version_or_date: "V1.1", page: "1 (Mechanical properties - dry status, Tensile strength (X-Y) 109.3 +/- 2.4 MPa, ISO 527)", url: "https://fiberon.polymaker.com/wp-content/uploads/TDS_FIBERON-PA6-CF20_V1.1_EN.pdf"}
      strength_z: {title: "Polymaker Fiberon PA6-CF20 Technical Data Sheet", version_or_date: "V1.1", page: "1 (Mechanical properties - dry status, Tensile strength (Z) 54.0 +/- 5.2 MPa, ISO 527)", url: "https://fiberon.polymaker.com/wp-content/uploads/TDS_FIBERON-PA6-CF20_V1.1_EN.pdf"}
      interlayer_shear: null
      density: {title: "Polymaker Fiberon PA6-CF20 Technical Data Sheet", version_or_date: "V1.1", page: "1 (Physical properties, Density 1.17 g/cm3 at 23 C, ISO 1183)", url: "https://fiberon.polymaker.com/wp-content/uploads/TDS_FIBERON-PA6-CF20_V1.1_EN.pdf"}
