# Materials library. Every number here was read from the cited page or PDF on 2026-10-20.
# Rules used:
#   - A value is only recorded if it was read directly from a fetched page or a downloaded PDF.
#   - null + a flag means the value could not be sourced.
#   - "third-party source" in a flag means the number did not come from the material maker.
#   - Downloaded PDFs are kept under .plans/dl/materials/ (see .plans/materials-research.md).

materials:
  - id: pla
    name: Prusament PLA
    process: fdm
    E_xy_MPa: 2300
    nu: 0.35
    strength_xy_MPa: 51
    strength_kind: tensile
    strength_z_MPa: null
    interlayer_shear_MPa: null
    density_g_cm3: 1.24
    cost_usd_per_kg: 29.99
    cost_note: "prusament.com PLA material page, standard 1 kg spool, 29.99 USD (VAT incl.), seen 2026-10-20"
    condition_note: "TDS 'Horizontal' print direction. Specimens printed on Original Prusa i3 MK3, 0.20 mm layers, 2 perimeters, 100% rectilinear infill, 215 C nozzle, 60 C bed, Slic3r PE 1.40.0. No moisture conditioning stated. TDS lists E as 2.3 +/- 0.1 GPa and strength as 'Tensile Yield Strength' 51 +/- 3 MPa."
    z_knockdown:
      value: 0.73
      source: "Ultimaker PLA TDS v2.00 (2022-04-20), p.2: tensile stress at break XY (flat) 45.5 +/- 1.1 MPa vs Z (upright) 33.1 +/- 2.8 MPa, ASTM D3039. Ratio 33.1/45.5 = 0.73. Different PLA brand; https://um-support-files.ultimaker.com/materials/2.85mm/tds/PLA/Ultimaker-PLA-TDS-v5.00.pdf"
    citations:
      E: {title: "Technical datasheet Prusament PLA by Prusa Polymers", version_or_date: "Version 1.1, last update 27-07-2022", page: "2 (Mechanical properties of 3D printed testing specimens, Tensile Modulus, Horizontal)", url: "https://storage.googleapis.com/prusa3d-content-prod-14e8-wordpress-prusament-prod/2024/05/7ca620c4-prusament-pla-plablend.zip"}
      nu: {title: "Gawel, Kuciel, Liber-Knec, Mierzwinski: Examination of Low-Cyclic Fatigue Tests and Poisson's Ratio Depending on the Different Infill Density of Polylactide (PLA) Produced by the FDM Method, Polymers 15(7):1651", version_or_date: "2023", page: "Table 1, 100% infill: 0.35", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10096656/"}
      strength_xy: {title: "Technical datasheet Prusament PLA by Prusa Polymers", version_or_date: "Version 1.1, last update 27-07-2022", page: "2 (Tensile Yield Strength, Horizontal, ISO 527-1)", url: "https://storage.googleapis.com/prusa3d-content-prod-14e8-wordpress-prusament-prod/2024/05/7ca620c4-prusament-pla-plablend.zip"}
      strength_z: null
      interlayer_shear: null
      density: {title: "Technical datasheet Prusament PLA by Prusa Polymers", version_or_date: "Version 1.1, last update 27-07-2022", page: "2 (Typical material properties, Density, ISO 1183)", url: "https://storage.googleapis.com/prusa3d-content-prod-14e8-wordpress-prusament-prod/2024/05/7ca620c4-prusament-pla-plablend.zip"}
      cost: {title: "Prusament PLA material page", version_or_date: "seen 2026-10-20", page: "price list, 1 kg standard colours", url: "https://prusament.com/materials/pla/"}
    flags:
      - "nu: typical value, not from TDS (measured on FDM PLA at 100% infill by Gawel et al. 2023)"
      - "strength_z: TDS has no Z-loaded value. Its 'Vertical xz' column (59 +/- 2 MPa) is an on-edge specimen loaded along the layers, so it was not used as Z strength. TDS also lists 'Interlayer Adhesion 17 +/- 3 MPa' by an in-house 'Prusa Polymers' method with no defined test; not used because the method is not stated."
      - "interlayer_shear: TDS 'Interlayer Adhesion 17 +/- 3 MPa' is not labelled as a shear value, so it was not recorded here."
      - "z_knockdown: ratio comes from a different maker's PLA (Ultimaker), not from Prusa."
      - "TDS is distributed by Prusa as a zip of PDFs (file 'Prusament PLA/1_PLA_Prusament_TDS_2022_EN.pdf'); an identical copy is also hosted by MatterHackers at https://www.matterhackers.com/r/xFvGl8"

